<title>Educatio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;700&display=swap">
<style>
/* Mise en page : une colonne joyeuse. Chaque personne (je, tu, il…) a sa couleur, partout dans l'appli ;
   chaque groupe de verbes aussi. Boutons « en relief », confettis quand c'est juste. */
:root {
  --bg: #eef3ff;
  --bg-dot: #d6e1ff;
  --surface: #ffffff;
  --ink: #1f2150;
  --ink-soft: #5b5f8f;
  --line: #dde3f6;
  --accent: #3a6df0; --accent-deep: #2448b8; --accent-soft: #e3ebff;
  --sun: #ffc93c; --sun-deep: #d99a00; --sun-soft: #fff4d1;
  --red: #e5484d; --red-deep: #b42a30; --red-soft: #ffe8e8;
  --green: #17a556; --green-deep: #0f7d3f; --green-soft: #dcf7e6;
  --term: #ea620a; --term-soft: #ffeedd;
  --on-color: #ffffff;
  /* une couleur par personne : je, tu, il, nous, vous, ils */
  --p0: #e8406a; --p1: #ef7400; --p2: #b37c00; --p3: #079c74; --p4: #3a6df0; --p5: #8a3fe6;
  /* une couleur par groupe */
  --g1: #17a556; --g2: #3a6df0; --g3: #8a3fe6;
  --font-display: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14163a; --bg-dot: #1f2257; --surface: #222558; --ink: #f1f2ff; --ink-soft: #aaaddb; --line: #343879;
    --accent: #7c9cff; --accent-deep: #4560cf; --accent-soft: #2d3475;
    --sun: #ffd25e; --sun-deep: #b98800; --sun-soft: #4a3f1f;
    --red: #ff6b70; --red-deep: #b9343a; --red-soft: #4a2240;
    --green: #3ddc84; --green-deep: #1a9150; --green-soft: #1b3f3c;
    --term: #ff9a4d; --term-soft: #4a2f22; --on-color: #14163a;
    --p0: #ff6f91; --p1: #ff9f43; --p2: #ffd23f; --p3: #2ee6a8; --p4: #7c9cff; --p5: #b78cff;
    --g1: #3ddc84; --g2: #7c9cff; --g3: #b78cff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14163a; --bg-dot: #1f2257; --surface: #222558; --ink: #f1f2ff; --ink-soft: #aaaddb; --line: #343879;
  --accent: #7c9cff; --accent-deep: #4560cf; --accent-soft: #2d3475;
  --sun: #ffd25e; --sun-deep: #b98800; --sun-soft: #4a3f1f;
  --red: #ff6b70; --red-deep: #b9343a; --red-soft: #4a2240;
  --green: #3ddc84; --green-deep: #1a9150; --green-soft: #1b3f3c;
  --term: #ff9a4d; --term-soft: #4a2f22; --on-color: #14163a;
  --p0: #ff6f91; --p1: #ff9f43; --p2: #ffd23f; --p3: #2ee6a8; --p4: #7c9cff; --p5: #b78cff;
  --g1: #3ddc84; --g2: #7c9cff; --g3: #b78cff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: radial-gradient(var(--bg-dot) 2px, transparent 2.5px) 0 0 / 24px 24px, var(--bg);
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 18px; }

/* Couleurs par personne et par groupe */
.p0 { --pc: var(--p0); } .p1 { --pc: var(--p1); } .p2 { --pc: var(--p2); }
.p3 { --pc: var(--p3); } .p4 { --pc: var(--p4); } .p5 { --pc: var(--p5); }
.g1 { --gc: var(--g1); } .g2 { --gc: var(--g2); } .g3 { --gc: var(--g3); }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: grid; gap: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 2.4rem; font-weight: 700; line-height: 1; letter-spacing: 0.01em; }
.brand h1 span { display: inline-block; color: var(--pc); }
.brand h1 span:nth-child(odd) { transform: rotate(-4deg); }
.brand h1 span:nth-child(even) { transform: translateY(2px) rotate(3deg); }
.brand p { margin: 4px 0 0; color: var(--ink-soft); font-size: 0.92rem; }

button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.btn {
  border: 0; border-radius: 16px; padding: 12px 22px;
  font-family: var(--font-display); font-size: 1.12rem; font-weight: 600; letter-spacing: 0.01em;
  background: var(--accent); color: var(--on-color); box-shadow: 0 5px 0 var(--accent-deep);
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: var(--surface); color: var(--accent); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.btn.ok { background: var(--green); box-shadow: 0 5px 0 var(--green-deep); }
.btn.ko { background: var(--red); box-shadow: 0 5px 0 var(--red-deep); }

/* Progression */
.status { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.dots { display: flex; gap: 5px; flex: 1 1 220px; min-width: 0; }
.dot { flex: 1; height: 14px; border-radius: 7px; background: var(--surface); border: 2px solid var(--line); }
.dot.ok { background: var(--green); border-color: var(--green); }
.dot.ko { background: var(--red); border-color: var(--red); }
.dot.now { border-color: var(--accent); background: var(--accent-soft); }
.counters { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 1rem; background: var(--surface); border: 2px solid var(--line); }
.pill svg { width: 18px; height: 18px; }
.pill.score svg { fill: var(--sun); stroke: var(--sun-deep); }
.pill.streak svg { fill: var(--ink-soft); }
.pill.streak.hot { background: var(--sun-soft); border-color: var(--sun); }
.pill.streak.hot svg { fill: var(--term); }

/* Carte question : la bande du haut prend la couleur de la personne */
.carte {
  background: var(--surface); border-radius: var(--radius);
  border: 3px solid var(--line); border-top: 12px solid var(--pc, var(--accent));
  box-shadow: 0 8px 0 var(--line);
  padding: 22px 24px 24px; display: grid; gap: 16px;
  transition: border-color .2s;
}
.consigne { margin: 0; color: var(--ink-soft); font-size: 0.98rem; }
.consigne strong { color: var(--accent); font-weight: 700; }
.verbe-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.infinitif { font-family: var(--font-display); font-size: 2.7rem; font-weight: 700; line-height: 1.05; letter-spacing: 0.01em; }
.chip { font-family: var(--font-display); font-size: 0.85rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--gc, var(--accent)); color: var(--on-color); }
.chip.exc { background: var(--sun); color: #3b2a00; }
form.reponse { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sujet {
  font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; line-height: 1;
  color: var(--pc); padding: 10px 16px; border-radius: 16px;
  border: 3px solid var(--pc); background: var(--surface);
}
#answer {
  font-family: var(--font-display); font-size: 1.7rem; font-weight: 600; color: var(--ink);
  flex: 1 1 180px; min-width: 0; padding: 8px 14px; border-radius: 16px;
  background: var(--bg); border: 3px solid var(--line);
}
#answer:focus { border-color: var(--pc, var(--accent)); outline: none; }
#answer:disabled { opacity: .8; }
.accents { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
.accents small { color: var(--ink-soft); margin-right: 2px; }
.accents button {
  min-width: 42px; height: 42px; border-radius: 12px; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600;
  border: 2px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: 0 3px 0 var(--line);
}
.accents button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.accents button:hover { background: var(--accent-soft); }
.hint { margin: 0; min-height: 1.2em; color: var(--red); font-size: 0.92rem; }

/* Retour */
.feedback { border-radius: var(--radius); padding: 20px 22px; display: grid; gap: 16px; border: 3px solid; }
.feedback.ok { background: var(--green-soft); border-color: var(--green); box-shadow: 0 7px 0 var(--green); }
.feedback.ko { background: var(--surface); border-color: var(--red); box-shadow: 0 7px 0 var(--red-soft); }
.verdict-row { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.verdict { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; line-height: 1.05; margin: 0; }
.ok .verdict { color: var(--green); }
.ko .verdict { color: var(--red); }
.badge { font-family: var(--font-display); font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--sun); color: #3b2a00; }
.compare { display: flex; gap: 10px 28px; flex-wrap: wrap; font-size: 1.2rem; }
.barre { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 3px; color: var(--ink-soft); }
.label { display: block; font-family: var(--font-display); font-weight: 600; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 4px; }
.decomp { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; }
.decomp .suj { color: var(--pc); }
.rad { color: var(--ink); }
.term { color: var(--term); background: var(--term-soft); border-radius: 6px; padding: 0 4px; font-weight: 700; }
.diag { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.diag li { padding: 10px 14px; border-radius: 14px; background: var(--red-soft); }
.ok .diag li { background: var(--surface); }
.regle { background: var(--accent-soft); border-radius: 18px; padding: 16px 18px; display: grid; gap: 10px; }
.regle h3 { margin: 0; font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--accent); }
.regle p { margin: 0; }
.terms-row { display: flex; flex-wrap: wrap; gap: 6px; }
.terms-row span { padding: 3px 10px; border-radius: 10px; background: var(--surface); font-size: 0.92rem; border-bottom: 3px solid var(--pc); }
.terms-row span.here { background: var(--term); color: var(--on-color); font-weight: 700; }
.tableau { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; }
.tableau div { padding: 6px 12px; border-radius: 12px; font-size: 1.08rem; border-left: 5px solid var(--pc); background: var(--bg); }
.tableau div.here { background: var(--term-soft); box-shadow: inset 0 0 0 2px var(--term); }
.tableau .pr { color: var(--pc); font-weight: 700; }
.accord { color: var(--ink-soft); }
.next-row { display: flex; justify-content: flex-end; }

/* Réglages */
.panel { background: var(--surface); border: 3px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 0 var(--line); padding: 20px 22px; display: grid; gap: 18px; }
.panel h2 { margin: 0; font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
legend { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; margin-bottom: 6px; padding: 0; }
.options { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border: 2.5px solid var(--line); border-radius: 14px; cursor: pointer; }
.opt input { accent-color: var(--accent); width: 18px; height: 18px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt.off { opacity: 0.5; cursor: not-allowed; }
.opt small { color: var(--ink-soft); }
.panel-foot { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }

/* Compte */
.actions-tete { display: flex; gap: 10px; flex-wrap: wrap; }
.porte-fermee .actions-tete { display: none; }
#btn-quitter-hl, .pill-hl { display: none; }
.hors-ligne #btn-quitter-hl { display: inline-block; }
.hors-ligne .pill-hl { display: inline-flex; background: var(--sun-soft); border-color: var(--sun); align-self: center; }
.hors-ligne #btn-compte { display: none !important; }
.choix-hl { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding-top: 14px; border-top: 2px dashed var(--line); }
.choix-hl small { color: var(--ink-soft); }
.accueil { display: grid; gap: 4px; }
.accueil h2 { margin: 0; }
.accueil p { margin: 0; color: var(--ink-soft); }
.btn.ghost.connecte { background: var(--accent-soft); border-color: var(--accent); }
.onglets { display: flex; flex-wrap: wrap; gap: 6px; background: var(--bg); padding: 5px; border-radius: 16px; width: fit-content; max-width: 100%; }
.onglets button { border: 0; background: transparent; padding: 8px 14px; border-radius: 12px; font-family: var(--font-display); font-weight: 600; color: var(--ink-soft); }
.onglets button.actif { background: var(--surface); color: var(--accent); box-shadow: 0 2px 0 var(--line); }
.formulaire { display: grid; gap: 14px; max-width: 480px; }
.formulaire p { margin: 0; }
.champ { display: grid; gap: 6px; font-family: var(--font-display); font-weight: 600; }
.champ input { font: inherit; font-family: var(--font-body); font-weight: 400; font-size: 1rem; width: 100%; min-width: 0; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--line); background: var(--bg); color: var(--ink); }
.champ input:focus { border-color: var(--accent); outline: none; }
.champ small { font-family: var(--font-body); font-weight: 400; font-size: .85rem; color: var(--ink-soft); }
.case { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.case input { flex: none; width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); }
.hint.msg-ok { color: var(--green); }
.lien { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.chiffres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.chiffres div { display: grid; gap: 2px; padding: 12px 8px; border-radius: 16px; background: var(--bg); text-align: center; }
.chiffres b { font-family: var(--font-display); font-size: 1.8rem; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.chiffres span { font-size: .85rem; color: var(--ink-soft); }
.historique { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.historique li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 8px 12px; border-radius: 12px; background: var(--bg); }
.code { font-family: var(--font-display); letter-spacing: .15em; color: var(--ink); background: var(--sun-soft); padding: 2px 8px; border-radius: 8px; }

/* Amis */
.pastille { display: inline-grid; place-items: center; min-width: 22px; height: 22px; margin-left: 6px; padding: 0 6px; border-radius: 999px;
  background: var(--red); color: var(--on-color); font-size: .8rem; line-height: 1; vertical-align: 2px; }
.hors-ligne #btn-amis { display: none !important; }
.mon-code { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; padding: 14px 16px; border-radius: 16px; background: var(--sun-soft); }
.code.grand { font-size: 1.9rem; padding: 2px 10px; background: var(--surface); }
.ajout-ami { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
.ajout-ami .champ { flex: 1 1 220px; min-width: 0; }
.ajout-ami input { text-transform: uppercase; letter-spacing: .15em; font-family: var(--font-display); font-weight: 600; }
.liste-amis { display: grid; gap: 16px; }
.demandes, .amis { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.demandes li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 14px; border-radius: 14px; background: var(--bg); }
.demandes .boutons { display: flex; gap: 8px; flex-wrap: wrap; }
.ami { display: grid; gap: 8px; padding: 12px 14px; border-radius: 16px; background: var(--bg); border-left: 6px solid var(--pc, var(--accent)); }
.ami.moi { border-left-color: var(--accent); background: var(--accent-soft); }
.ami.vide { border-left-color: var(--line); color: var(--ink-soft); }
.ami-tete { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.ami-tete b { font-family: var(--font-display); font-size: 1.2rem; }
.ami-tete span { color: var(--ink-soft); font-size: .88rem; }
.ami-chiffres { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .92rem; color: var(--ink-soft); }
.ami-chiffres b { font-family: var(--font-display); font-size: 1.1rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.ami-actions { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.ami .historique li { background: var(--surface); }
.lien.danger { color: var(--red); }

/* Défis */
.pill-defi { background: var(--sun-soft); border-color: var(--sun); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.counters { flex-wrap: wrap; min-width: 0; }
.nouveau-defi { display: grid; gap: 10px; padding: 14px 16px; border-radius: 16px; background: var(--accent-soft); }
.nouveau-defi p { margin: 0; }
.defi { display: grid; gap: 8px; padding: 12px 14px; border-radius: 16px; background: var(--bg); border-left: 6px solid var(--sun); }
.defi p { margin: 0; }
.classement { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.classement li { display: flex; align-items: baseline; gap: 10px; padding: 6px 10px; border-radius: 10px; background: var(--surface); flex-wrap: wrap; }
.classement li.moi { box-shadow: inset 0 0 0 2px var(--accent); }
.classement .nom { font-weight: 600; flex: 1 1 auto; }
.classement .rang { font-family: var(--font-display); font-weight: 700; color: var(--accent); min-width: 2.2em; }
.classement li:first-child .rang { color: var(--sun-deep); }
.gagnant { font-family: var(--font-display); font-weight: 700; color: var(--green); }
.fin-defi { margin: 0; padding: 12px 14px; border-radius: 14px; background: var(--sun-soft); font-weight: 600; }

/* Fin de série */
.etoiles { display: flex; gap: 6px; }
.etoiles svg { width: 54px; height: 54px; fill: var(--line); }
.etoiles svg.on { fill: var(--sun); stroke: var(--sun-deep); stroke-width: 1.2; }
.etoiles svg:nth-child(2) { transform: translateY(-10px); }
.score-big { font-family: var(--font-display); font-size: 3.6rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--accent); }
.score-big small { font-size: 1.5rem; color: var(--ink-soft); }
.erreurs { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.erreurs li { display: flex; gap: 10px; flex-wrap: wrap; padding: 8px 12px; background: var(--red-soft); border-radius: 12px; }
.stats { color: var(--ink-soft); font-size: 0.92rem; margin: 0; }

#confettis { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

@media (max-width: 520px) {
  .carte { padding: 18px 16px 20px; }
  .infinitif { font-size: 2.2rem; }
  .brand h1 { font-size: 2.1rem; }
  .tableau { grid-template-columns: 1fr; }
  #btn-verifier { flex: 1 1 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .feedback { animation: pop .3s cubic-bezier(.3, 1.5, .6, 1); }
  .ok .verdict { animation: hop .5s ease-out; }
  .badge { animation: hop .6s ease-out .1s both; }
  .carte { animation: glisse .25s ease-out; }
  .etoiles svg.on { animation: hop .5s ease-out both; }
  .etoiles svg.on:nth-child(2) { animation-delay: .15s; }
  .etoiles svg.on:nth-child(3) { animation-delay: .3s; }
  @keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
  @keyframes hop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes glisse { from { transform: translateY(8px); opacity: .5; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1 aria-label="Educatio"><span class="p0">E</span><span class="p1">d</span><span class="p2">u</span><span class="p3">c</span><span class="p4">a</span><span class="p5">t</span><span class="p0">i</span><span class="p1">o</span></h1>
      <p>Entraînement à la conjugaison · 6e</p>
    </div>
    <div class="actions-tete">
      <span class="pill pill-hl">Hors ligne</span>
      <button class="btn ghost" id="btn-quitter-hl" type="button">Me connecter</button>

function groupeExplication(v, formes) {

  const fin = v.inf.endsWith('oir') ? 'oir' : 're';

    html += '<p>Ce verbe est irrégulier : il ne suit aucun modèle.</p>';

const forme = f => f.radical + f.term;
const sansAccent = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
const pick = a => a[Math.floor(Math.random() * a.length)];
const commenceVoyelle = s => /^[aeiouyéèêâîôûh]/i.test(s);
function pronomPour(p, f) {
  const pr = ['je', 'tu', 'il / elle / on', 'nous', 'vous', 'ils / elles'][p];
  return p === 0 && commenceVoyelle(f) ? 'j\'' : pr + ' ';
}
function nettoyer(s) {
  return s.normalize('NFC').toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, ' ').trim();
}
function retirerSujet(s, item) {
  const suj = nettoyer(item.sujet);
  if (s.startsWith(suj + ' ')) return s.slice(suj.length + 1);
  if (suj.endsWith("'") && s.startsWith(suj)) return s.slice(suj.length);
  const m = s.match(/^(je |j'|j |tu |il |elle |on |nous |vous |ils |elles )/);
  return m ? s.slice(m[0].length) : s;
}
function nomAccent(c) {
  if ('é'.includes(c)) return 'accent aigu';
  if ('èàù'.includes(c)) return 'accent grave';
  if ('êâîôû'.includes(c)) return 'accent circonflexe';
  if ('ëïü'.includes(c)) return 'tréma';
  if (c === 'ç') return 'cédille';
  return 'accent';
}

// ---------- Stockage (confort, facultatif) ----------
const STORE = 'educatio-v1';
function lireStats() {
  try { return Object.assign({ total: 0, bonnes: 0, record: 0, fautes: {}, reglages: null }, JSON.parse(localStorage.getItem(STORE) || '{}')); }
  catch (e) { return { total: 0, bonnes: 0, record: 0, fautes: {}, reglages: null }; }
}
// Mode hors ligne : on joue sans compte et rien n'est gardé (seuls les réglages le sont)
let modeHorsLigne = false;
function ecrireStats() {
  try {
    if (modeHorsLigne) { const garde = lireStats(); garde.reglages = stats.reglages; localStorage.setItem(STORE, JSON.stringify(garde)); }
    else localStorage.setItem(STORE, JSON.stringify(stats));
  } catch (e) {}
}
let stats = lireStats();

// ---------- Réglages ----------
let reglages = Object.assign({ temps: ['present'], groupes: [1, 2, 3], exceptions: false, badge: true, noms: true, longueur: 10 }, stats.reglages || {});
function construireReglages() {
  $('opt-temps').innerHTML = Object.entries(TEMPS).map(([k, t]) =>
    `<label class="opt ${t.disponible ? '' : 'off'}"><input type="checkbox" id="t-${k}" value="${k}" ${t.disponible ? '' : 'disabled'} ${reglages.temps.includes(k) && t.disponible ? 'checked' : ''}> ${t.nom}${t.disponible ? '' : ' <small>(bientôt)</small>'}</label>`).join('');
  [1, 2, 3].forEach(g => $('g' + g).checked = reglages.groupes.includes(g));
  $('sorte-exc').checked = !!reglages.exceptions;
  $('sorte-tous').checked = !reglages.exceptions;
  $('opt-badge').checked = reglages.badge !== false;
  $('opt-noms').checked = reglages.noms;
  $('len10').checked = reglages.longueur === 10;
  $('len20').checked = reglages.longueur === 20;
}
$('btn-reglages').onclick = () => {
  const panel = $('reglages');
  panel.hidden = !panel.hidden;
  $('compte').hidden = true;
  if (!panel.hidden) { construireReglages(); $('reglages-hint').textContent = ''; }
};
$('btn-appliquer').onclick = () => {
  const temps = Object.keys(TEMPS).filter(k => TEMPS[k].disponible && $('t-' + k).checked);
  const groupes = [1, 2, 3].filter(g => $('g' + g).checked);
  if (!temps.length) { $('reglages-hint').textContent = 'Choisis au moins un temps.'; return; }
  if (!groupes.length) { $('reglages-hint').textContent = 'Choisis au moins un groupe de verbes.'; return; }
  const exceptions = $('sorte-exc').checked;
  const vides = temps.filter(k => !VERBES.some(v => groupes.includes(v.g) && (!exceptions || TEMPS[k].exception(v))));
  if (vides.length) {
    $('reglages-hint').textContent = `Il n'y a aucun verbe à exception ${vides.map(k => TEMPS[k].au).join(' ni ')} dans ${groupes.length > 1 ? 'ces groupes' : 'ce groupe'}. Ajoute un groupe ou décoche ce temps.`;
    return;
  }
  reglages = { temps, groupes, exceptions, badge: $('opt-badge').checked, noms: $('opt-noms').checked, longueur: $('len20').checked ? 20 : 10 };
  stats.reglages = reglages; ecrireStats();
  $('reglages').hidden = true;
  nouvelleSerie();
};

// ---------- Tirage ----------
let serie, item, dernierVerbe = null, repondu = false;

function tirerItem() {
  const temps = pick(reglages.temps);
  const convient = v => reglages.groupes.includes(v.g) && (!reglages.exceptions || TEMPS[temps].exception(v));
  let candidats = VERBES.filter(v => convient(v) && v.inf !== dernierVerbe);
  if (!candidats.length) candidats = VERBES.filter(convient);
  // Les verbes déjà ratés reviennent plus souvent
  const poids = candidats.map(v => 1 + Math.min(4, stats.fautes[v.inf] || 0));
  let r = Math.random() * poids.reduce((a, b) => a + b, 0), verbe = candidats[0];
  for (let i = 0; i < candidats.length; i++) { r -= poids[i]; if (r <= 0) { verbe = candidats[i]; break; } }
  const p = Math.floor(Math.random() * 6);
  return creerItem(verbe, p, temps);
}
function creerItem(verbe, p, temps) {
  const f = forme(TEMPS[temps].conjuguer(verbe)[p]);
  let sujet, nom = false, genre = '?';
  if (reglages.noms && NOMS[p] && Math.random() < 0.4) { const n = pick(NOMS[p]); sujet = n.t; genre = n.g; nom = true; }
  else if (p === 0 && commenceVoyelle(f)) sujet = 'j\'';
  else { sujet = pick(PRONOMS_TIRAGE[p]); genre = { il: 'm', ils: 'm', elle: 'f', elles: 'f' }[sujet] || '?'; }
  return { verbe, p, temps, sujet, nom, genre };
}

function nouvelleSerie(items, defi = null) {
  serie = { longueur: items ? items.length : reglages.longueur, imposes: items || null, n: 0, resultats: [], erreurs: [], rappels: [], score: 0, streak: 0, tempsJoues: new Set(),
    defi, debut: Date.now() };
  $('pill-defi').hidden = !defi;
  if (defi) $('pill-defi').textContent = defi.adversaires.length ? `Défi contre ${defi.adversaires.join(', ')}` : 'Défi';
  $('fin').hidden = true; $('jeu').hidden = document.body.classList.contains('porte-fermee');
  questionSuivante();
}

function questionSuivante() {
  if (serie.n >= serie.longueur) return finDeSerie();
  repondu = false;
  // Une question ratée revient 3 questions plus tard
  serie.rappels.forEach(r => r.dans--);
  const idx = serie.rappels.findIndex(r => r.dans <= 0);
  if (serie.imposes) {
    const im = serie.imposes[serie.n];
    item = im.sujet ? { ...im } : creerItem(im.verbe, im.p, im.temps); // un défi garde ses sujets
  }
  else if (idx >= 0) { const r = serie.rappels.splice(idx, 1)[0]; item = creerItem(r.verbe, r.p, r.temps); }
  else item = tirerItem();
  dernierVerbe = item.verbe.inf;
  serie.tempsJoues.add(item.temps);

  $('temps-label').textContent = TEMPS[item.temps].au;
  $('infinitif').textContent = item.verbe.inf;
  $('groupe').textContent = ['', '1er groupe', '2e groupe', '3e groupe'][item.verbe.g];
  $('groupe').className = 'chip g' + item.verbe.g;
  $('chip-exc').hidden = reglages.badge === false || !TEMPS[item.temps].exception(item.verbe);
  $('sujet').textContent = item.sujet;
  const carte = $('carte');
  carte.className = 'carte p' + item.p;
  carte.style.animation = 'none'; void carte.offsetWidth; carte.style.animation = '';
  const inp = $('answer');
  inp.value = ''; inp.disabled = false; $('btn-verifier').disabled = false;
  $('hint').textContent = '';
  $('feedback').hidden = true;
  majStatut();
  inp.focus();
}

function majStatut() {
  let html = '';
  for (let i = 0; i < serie.longueur; i++) {
    const r = serie.resultats[i];
    html += `<span class="dot ${r === true ? 'ok' : r === false ? 'ko' : i === serie.n ? 'now' : ''}"></span>`;
  }
  $('dots').innerHTML = html;
  $('score').textContent = `${serie.score} / ${serie.n}`;
  $('streak').textContent = serie.streak;
  $('streak-pill').classList.toggle('hot', serie.streak >= 3);
}

// ---------- Confettis ----------
const COULEURS_FETE = ['#ef476f', '#ff9f1c', '#ffd23f', '#06d6a0', '#3a86ff', '#8e44ec'];
function confettis(nombre = 70) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let cv = $('confettis');
  if (!cv) { cv = document.createElement('canvas'); cv.id = 'confettis'; cv.setAttribute('aria-hidden', 'true'); document.body.appendChild(cv); }
  const ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const bouts = Array.from({ length: nombre }, () => ({
    x: innerWidth / 2 + (Math.random() - .5) * innerWidth * .3, y: innerHeight * .45,
    vx: (Math.random() - .5) * 14, vy: -6 - Math.random() * 10,
    t: 6 + Math.random() * 6, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
    c: pick(COULEURS_FETE), rond: Math.random() < .3,
  }));
  const debut = performance.now();
  (function image(now) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    bouts.forEach(b => {
      b.vy += .35; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c;
      if (b.rond) { ctx.beginPath(); ctx.arc(0, 0, b.t / 2, 0, 7); ctx.fill(); } else ctx.fillRect(-b.t / 2, -b.t / 4, b.t, b.t / 2);
      ctx.restore();
    });
    if (now - debut < 2200) requestAnimationFrame(image); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(debut);
}

// ---------- Correction ----------
function analyser(rep, item) {
  const T = TEMPS[item.temps], v = item.verbe, p = item.p;
  if (T.analyser) return T.analyser(rep, item);
  const formes = T.conjuguer(v), f = formes[p], bonne = forme(f);
  if (rep === bonne) return { ok: true, bonne, formes, f };
  if ((f.alts || []).includes(rep)) return { ok: true, bonne, formes, f, note: `On peut aussi l'écrire « ${bonne} ».` };

  const d = [];
  const sujetTxt = sujetTexte(item);
  const homo = item.temps === 'present' && HOMOPHONES[v.inf] && HOMOPHONES[v.inf][p];

  if (homo && homo.faux.includes(rep)) {
    d.push(homo.msg);
  } else if (sansAccent(rep) === sansAccent(bonne)) {
    d.push(...diagAccents(rep, bonne));
    const note = T.note(v);
    if (note && (v.mod || v.fam === 'connaitre' || v.inf === 'recevoir' || item.temps !== 'present')) d.push(note);
  } else {
    d.push(autreTempsDe(rep, item));
    // Forme d'une autre personne ?
    const autres = formes.map((x, i) => ({ i, f: forme(x) })).filter(x => x.i !== p && x.f === rep);
    if (autres.length) {
      const qui = autres.map(x => `« ${['je', 'tu', 'il', 'nous', 'vous', 'ils'][x.i]} »`).join(' ou ');
      d.push(`« ${esc(rep)} », c'est la forme qui va avec ${qui}. Ici, le sujet est ${sujetTxt} : c'est la ${PERSONNES[p].label}.`);
    }
    if (rep === v.inf) {
      d.push('Tu as écrit l\'infinitif, c\'est-à-dire le « nom » du verbe. Il faut le conjuguer : changer sa fin selon le sujet.');
      d.push(T.conseil(v, p, f.term));
    } else if (f.entier) {
      d.push(T.conseil(v, p, f.term), T.note(v));
    } else {
      const special = T.cas(v, p, rep, f, formes);
      if (rep.startsWith(f.radical) && !special.radical) {
        const e = rep.slice(f.radical.length);
        d.push(`Le début du verbe (le radical « ${f.radical} ») est juste, mais la terminaison n'est pas bonne : tu as écrit ${e ? '« -' + esc(e) + ' »' : 'aucune terminaison'}, ${f.term ? 'il faut « -' + f.term + ' »' : 'alors qu\'il ne faut rien ajouter'}.`);
        d.push(...(special.msgs.length ? special.msgs : [T.conseil(v, p, f.term)]));
      } else if (f.term && rep.endsWith(f.term)) {
        d.push(`La terminaison « -${f.term} » est juste, mais le début du verbe (le radical) n'est pas bon : il faut « ${f.radical} », tu as écrit « ${esc(rep.slice(0, rep.length - f.term.length))} ».`);
        d.push(...(special.msgs.length ? special.msgs : [T.note(v) || 'Pour ce verbe, le radical change selon la personne : regarde le tableau ci-dessous.']));
      } else {
        d.push(`Il faut écrire « ${bonne} » : le radical est « ${f.radical} » et la terminaison ${f.term ? '« -' + f.term + ' »' : 'est vide (on n\'ajoute rien)'}.`);
        d.push(...(special.msgs.length ? special.msgs : [T.conseil(v, p, f.term)]));
        const note = T.note(v); if (note) d.push(note);
      }
    }
  }
  return { ok: false, bonne, formes, f, diags: [...new Set(d.filter(Boolean))] };
}

function sujetTexte(item) {
  return item.nom ? `« ${item.sujet} » (on peut le remplacer par « ${PERSONNES[item.p].remplace} »)` : `« ${item.sujet.replace("'", '')}${item.sujet.endsWith("'") ? 'e' : ''} »`;
}
// La réponse est-elle juste… mais à un autre temps ?
function autreTempsDe(rep, item) {
  for (const [k, T2] of Object.entries(TEMPS)) {
    if (k === item.temps || T2.analyser) continue;
    if (forme(T2.conjuguer(item.verbe)[item.p]) === rep) return `« ${esc(rep)} », c'est le verbe ${T2.au}. Ici, il faut le conjuguer ${TEMPS[item.temps].au}.`;
  }
  return '';
}

function casPresent(v, p, rep, f, formes) {
  const msgs = []; let radical = false;
  if (p === 5 && f.term.endsWith('ent') && (rep === forme(formes[2]) || rep === f.radical + 'e' || rep === f.radical + 'es' || rep === f.radical + 's' || rep === f.radical))
    msgs.push('Le -ent de « ils / elles » ne s\'entend pas à l\'oral : c\'est pour ça qu\'on l\'oublie souvent. Mais à l\'écrit, il est obligatoire !');
  if (p === 2 && comme1erGroupe(v) && rep.endsWith('t'))
    msgs.push('Avec les verbes en -er, il n\'y a jamais de t à la 3e personne : il chante, elle joue, on mange.');
  if (p === 2 && f.term === '' && rep === f.radical + 't')
    msgs.push('Pas de t ici ! Le verbe garde la lettre de son radical et on n\'ajoute rien : il prend, il rend, il met.');
  if ((p === 0 || p === 1) && v.g === 2 && rep === f.radical + 'i')
    msgs.push('N\'oublie pas le s final : je finis, tu finis. (« fini » sans s, c\'est le participe passé : j\'ai fini.)');
  if (p === 1 && !/[sx]$/.test(rep))
    msgs.push('Avec tu, le verbe se termine toujours par -s (ou par -x pour « tu peux », « tu veux »).');
  if (p === 4 && comme1erGroupe(v) && /(er|é|ée|és)$/.test(rep))
    msgs.push('« -er », « -é » et « -ez » se prononcent pareil, mais avec vous, au présent, on écrit toujours « -ez » : vous chantez.');
  if (p === 3 && rep.endsWith('ont'))
    msgs.push('« -ont » se prononce comme « -ons », mais avec nous on écrit toujours « -ons » : nous chantons.');
  if (p === 3 && v.mod === 'ger' && rep === v.inf.slice(0, -2) + 'ons') { radical = true; msgs.push(NOTES_MOD.ger); }
  return { msgs, radical };
}

function diagAccents(a, b) {
  const out = [];
  if (a.length !== b.length) return [`Attention aux accents : il faut écrire « ${b} ».`];
  for (let i = 0; i < b.length; i++) {
    const c = b[i], w = a[i];
    if (c === w) continue;
    if (c === 'ç') out.push('Il manque la cédille : il faut « ç » et pas « c ».');
    else if (w === 'ç') out.push('Il n\'y a pas de cédille ici : on écrit « c ».');
    else if (sansAccent(c) === c) out.push(`Il n'y a pas d'accent sur ce « ${c} » : tu as écrit « ${esc(w)} ».`);
    else if (sansAccent(w) === w) out.push(`Il manque un accent : il faut « ${c} » (${nomAccent(c)}).`);
    else out.push(`Ce n'est pas le bon accent : il faut « ${c} » (${nomAccent(c)}) et pas « ${esc(w)} » (${nomAccent(w)}).`);
  }
  return out;
}

function tableauHTML(formes, p) {
  const ordre = [0, 3, 1, 4, 2, 5]; // deux colonnes : singulier | pluriel
  return '<div class="tableau">' + ordre.map(i => {
    const f = formes[i], txt = forme(f);
    const corps = f.entier ? `<span class="rad">${txt}</span>` : `<span class="rad">${f.radical}</span>${f.term ? `<span class="term">${f.term}</span>` : ''}`;
    return `<div class="p${i} ${i === p ? 'here' : ''}"><span class="pr">${pronomPour(i, txt)}</span>${corps}${f.suffixe ? `<span class="accord">${f.suffixe}</span>` : ''}</div>`;
  }).join('') + '</div>';
}
function decompHTML(item, f) {
  const suj = `<span class="suj">${esc(item.sujet)}</span>` + (item.sujet.endsWith("'") ? '' : ' ');
  if (f.entier) return `<span class="decomp p${item.p}">${suj}<span class="rad">${forme(f)}</span></span>`;
  return `<span class="decomp p${item.p}">${suj}<span class="rad">${f.radical}</span>${f.term ? `<span class="term">${f.term}</span>` : ''}</span>`;
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (repondu) return;
  const brut = nettoyer($('answer').value);
  if (!brut) { $('hint').textContent = 'Écris ta réponse avant de vérifier.'; return; }
  const rep = retirerSujet(brut, item);
  const res = analyser(rep, item);
  repondu = true;
  $('answer').disabled = true; $('btn-verifier').disabled = true;

  stats.total++;
  serie.resultats[serie.n] = res.ok;
  if (res.ok) {
    serie.score++; serie.streak++; stats.bonnes++;
    stats.record = Math.max(stats.record, serie.streak);
    if (stats.fautes[item.verbe.inf]) stats.fautes[item.verbe.inf]--;
  } else {
    serie.streak = 0;
    stats.fautes[item.verbe.inf] = (stats.fautes[item.verbe.inf] || 0) + 1;
    serie.erreurs.push({ item, rep, bonne: res.bonne });
    if (!serie.imposes) serie.rappels.push({ verbe: item.verbe, p: item.p, temps: item.temps, dans: 3 });
  }
  serie.n++;
  ecrireStats();
  afficherRetour(res, rep);
  majStatut();
});

function afficherRetour(res, rep) {
  const T = TEMPS[item.temps], f = res.f || res.formes[item.p];
  const fb = $('feedback');
  const dernier = serie.n >= serie.longueur;
  const btn = `<div class="next-row"><button class="btn ${res.ok ? 'ok' : 'ko'}" id="btn-suivant" type="button">${dernier ? 'Voir mon résultat' : 'Question suivante'} →</button></div>`;
  if (res.ok) {
    const bravo = pick(['Bravo !', 'Exact !', 'Parfait !', 'Bien joué !', 'C\'est ça !', 'Super !']);
    const paliers = { 3: 'Série de 3 !', 5: '5 d\'affilée !', 10: '10 d\'affilée, champion !', 15: '15 d\'affilée !', 20: '20 sans faute !' };
    const badge = paliers[serie.streak] ? `<span class="badge">${paliers[serie.streak]}</span>` : '';
    fb.className = 'feedback ok';
    fb.innerHTML = `<div class="verdict-row"><p class="verdict">${bravo}</p>${badge}</div>
      <div><span class="label">Ta réponse</span>${decompHTML(item, f)}</div>
      <ul class="diag">${res.note ? `<li>${res.note}</li>` : ''}<li>${T.conseil(item.verbe, item.p, f.term, item)}</li></ul>${btn}`;
    confettis(badge ? 120 : 60);
  } else {
    fb.className = 'feedback ko';
    fb.innerHTML = `<p class="verdict">${pick(['Pas tout à fait…', 'Presque !', 'Oups, regarde bien'])}</p>
      <div class="compare">
        <div><span class="label">Tu as écrit</span><span class="barre">${esc(item.sujet)}${item.sujet.endsWith("'") ? '' : ' '}${esc(rep)}</span></div>
        <div><span class="label">La bonne réponse</span>${decompHTML(item, f)}</div>
      </div>
      <div><span class="label">Ce qui ne va pas</span><ul class="diag">${res.diags.map(x => `<li>${x}</li>`).join('')}</ul></div>
      <div class="regle"><h3>La règle à retenir</h3>${T.regle(item.verbe, item.p, item)}</div>
      <div><span class="label">« ${item.verbe.inf} » ${T.au}</span>${tableauHTML(res.formes, item.p)}</div>${btn}`;
  }
  fb.hidden = false;
  const b = $('btn-suivant');
  b.onclick = questionSuivante;
  b.focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ---------- Fin de série ----------
function finDeSerie() {
  const s = serie.score, n = serie.longueur;
  const msg = s === n ? 'Parfait, aucune faute !' : s >= n * 0.8 ? 'Très bien !' : s >= n * 0.5 ? 'C\'est en bonne voie, continue.' : 'Ça va venir : on recommence avec les erreurs ?';
  const fin = $('fin');
  const nbEtoiles = s === n ? 3 : s >= n * 0.8 ? 2 : s >= n * 0.5 ? 1 : 0;
  const etoile = on => `<svg class="${on ? 'on' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>`;
  fin.innerHTML = `<div class="etoiles" role="img" aria-label="${nbEtoiles} étoile${nbEtoiles > 1 ? 's' : ''} sur 3">${[0, 1, 2].map(i => etoile(i < nbEtoiles)).join('')}</div>
    <h2>${msg}</h2>
    <div class="score-big">${s}<small> / ${n}</small></div>
    ${serie.erreurs.length ? `<div><span class="label">Tes erreurs</span><ul class="erreurs">${serie.erreurs.map(e =>
      `<li><span class="barre" style="text-decoration:line-through">${esc(e.item.sujet)} ${esc(e.rep)}</span> → <b>${esc(e.item.sujet)}${e.item.sujet.endsWith("'") ? '' : ' '}${e.bonne}</b> <small>(${e.item.verbe.inf})</small></li>`).join('')}</ul></div>` : ''}
    ${modeHorsLigne ? '' : `<p class="stats">Depuis le début : ${stats.bonnes} bonnes réponses sur ${stats.total} · record de ${stats.record} bonnes réponses d'affilée.</p>`}
    <p class="stats" id="fin-compte"></p>
    ${serie.defi ? '<p class="fin-defi" id="fin-defi">Enregistrement du défi…</p>' : ''}
    <div class="panel-foot">
      ${serie.erreurs.length ? '<button class="btn ghost" id="btn-erreurs" type="button">Refaire mes erreurs</button>' : ''}
      <button class="btn" id="btn-nouvelle" type="button">Nouvelle série</button>
    </div>`;
  $('jeu').hidden = true; fin.hidden = false;
  $('btn-nouvelle').onclick = () => nouvelleSerie();
  if (serie.erreurs.length) {
    const items = serie.erreurs.map(e => ({ verbe: e.item.verbe, p: e.item.p, temps: e.item.temps }));
    $('btn-erreurs').onclick = () => nouvelleSerie(items);
  }
  $('btn-nouvelle').focus();
  if (nbEtoiles >= 2) confettis(160);
  if (serie.defi) terminerDefi();
  enregistrerSerieEnLigne({
    p_temps: [...serie.tempsJoues], p_exceptions: !!reglages.exceptions && !serie.imposes, p_score: s, p_longueur: n,
    p_record: stats.record, p_erreurs: serie.erreurs.map(e => ({ v: e.item.verbe.inf, p: e.item.p, t: e.item.temps })), p_fautes: stats.fautes,
  }).then(etat => {
    const zone = $('fin-compte'); if (!zone) return;
    if (etat === 'hors-ligne') zone.textContent = 'Mode hors ligne : ce résultat n\'est pas enregistré.';
    else if (etat === 'ok') zone.textContent = 'Résultat enregistré dans ton compte.';
    else if (etat === 'attente') zone.textContent = 'Pas de connexion : le résultat sera enregistré dans ton compte dès que possible.';
    else if (sb) { zone.innerHTML = '<button type="button" class="lien" id="btn-fin-compte">Crée un compte</button> pour garder tes résultats et suivre tes progrès.'; $('btn-fin-compte').onclick = () => ouvrirCompte('inscription'); }
  });
}

// ---------- Compte en ligne (Supabase) ----------
// Sans serveur configuré (adresse vide), l'appli marche seule, sans compte.
// build.py remplit ces deux valeurs à partir de supabase.json pour la version en ligne.
const SUPABASE_URL = '', SUPABASE_CLE = '';
const sb = SUPABASE_URL && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_CLE) : null;
const ATTENTE = 'educatio-attente';
const PSEUDO_OK = /^[A-Za-z0-9_-]{3,20}$/;
let session = null, profil = null, vueCompte = null;

function messageErreur(e) {
  const m = (e && e.message) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'E-mail, pseudo ou mot de passe incorrect.';
  if (/(creer_defi|enregistrer_defi|mes_defis)/i.test(m)) return 'Les défis ne sont pas encore activés sur le serveur.';
  if (/pas_ami/i.test(m)) return 'Tu ne peux défier que tes amis.';
  if (/choix_amis/i.test(m)) return 'Choisis entre 1 et 10 amis à défier.';
  if (/trop_defis/i.test(m)) return 'Tu as déjà lancé 20 défis aujourd\'hui : attends demain pour en lancer d\'autres.';
  if (/deja_joue/i.test(m)) return 'Tu as déjà joué ce défi : ton premier score compte.';
  if (/defi_termine/i.test(m)) return 'Ce défi est terminé : il durait 7 jours.';
  if (/trop_essais/i.test(m)) return 'Trop d\'essais ratés avec ce pseudo : attends 15 minutes, ou connecte-toi avec ton e-mail.';
  if (/email_pour_connexion|PGRST202/i.test(m)) return 'La connexion avec le pseudo n\'est pas encore activée : connecte-toi avec ton e-mail.';
  if (/Email not confirmed/i.test(m)) return 'Ton adresse e-mail n\'est pas encore confirmée : clique sur le lien reçu par e-mail.';
  if (/already registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail. Connecte-toi plutôt.';
  if (/Password should be/i.test(m)) return 'Le mot de passe doit faire au moins 8 caractères.';
  if (/Database error saving new user/i.test(m)) return 'Ce pseudo vient d\'être pris : choisis-en un autre.';
  if (/rate limit|too many/i.test(m)) return 'Trop d\'essais d\'un coup : attends quelques minutes et réessaie.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Pas de connexion internet : réessaie quand tu seras connecté.';
  if (/valid email|invalid format/i.test(m)) return 'Cette adresse e-mail n\'est pas valide.';
  if (/same.*password|different from the old/i.test(m)) return 'Choisis un mot de passe différent de l\'ancien.';
  return 'Ça n\'a pas marché : ' + m;
}
const valeur = id => $(id).value.trim();
const lienRetour = () => location.origin + location.pathname;
function msgCompte(texte, ok = false) {
  const m = $('c-msg'); if (!m) return;
  m.textContent = texte; m.className = 'hint' + (ok ? ' msg-ok' : '');
}

function majBoutonCompte() {
  const b = $('btn-compte');
  if (!sb) { b.hidden = true; return; }
  b.hidden = false;
  b.textContent = profil ? profil.pseudo : 'Mon compte';
  b.classList.toggle('connecte', !!profil);
}

async function chargerProfil() {
  if (!session) { profil = null; amis = null; defis = null; majBoutonCompte(); majBoutonAmis(); return; }
  const { data, error } = await sb.from('profils').select('*').eq('id', session.user.id).maybeSingle();
  if (error) return;
  profil = data;
  // Les verbes ratés sur un autre appareil reviennent aussi plus souvent ici
  if (profil) for (const [k, n] of Object.entries(profil.fautes || {})) stats.fautes[k] = Math.max(stats.fautes[k] || 0, n);
  majBoutonCompte();
  rafraichirAmis();
  envoyerEnAttente();
  if (!$('compte').hidden && vueCompte === 'profil') ouvrirCompte('profil');
}

// Sans compte connecté, l'appli s'ouvre sur la connexion : on ne joue qu'une fois connecté
const VUES_ACCUEIL = ['connexion', 'inscription', 'oubli'];
function afficherPorte(ouverte) {

    $('jeu').hidden = true; $('fin').hidden = true; $('reglages').hidden = true;

function ouvrirCompte(vue) {
  vueCompte = vue;
  $('reglages').hidden = true;

  const titre = session ? '<h2>Mon compte</h2>'

    <form class="formulaire" id="f-compte" novalidate>

      <label class="champ">Mot de passe<input id="c-mdp" type="password" autocomplete="current-password"></label>
      <p class="hint" id="c-msg"></p>
      <div class="panel-foot"><button type="button" class="lien" data-vue="oubli">Mot de passe oublié ?</button><button class="btn" type="submit">Me connecter</button></div>
    </form>`;
  if (vue === 'inscription') c.innerHTML = `${titre}${onglets}
    <form class="formulaire" id="f-compte" novalidate>
      <label class="champ">Pseudo<input id="c-pseudo" type="text" autocomplete="username" maxlength="20" autocapitalize="off" spellcheck="false">
        <small>De 3 à 20 caractères : lettres sans accents, chiffres, - ou _. C'est le seul nom que les autres verront.</small></label>
      <label class="champ">E-mail<input id="c-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off">
        <small>Il sert seulement à te connecter et à retrouver ton mot de passe. Personne d'autre ne le voit.</small></label>
      <label class="champ">Mot de passe<input id="c-mdp" type="password" autocomplete="new-password"><small>Au moins 8 caractères.</small></label>
      <label class="champ">Mot de passe, encore une fois<input id="c-mdp2" type="password" autocomplete="new-password"></label>
      <label class="case"><input id="c-parent" type="checkbox"> <span>Un de mes parents est d'accord pour que je crée ce compte.</span></label>
      <p class="hint" id="c-msg"></p>
      <div class="panel-foot"><button class="btn" type="submit">Créer mon compte</button></div>
    </form>`;
  if (vue === 'oubli') c.innerHTML = `<h2>Mot de passe oublié</h2>
    <form class="formulaire" id="f-compte" novalidate>
      <p>Écris l'adresse e-mail de ton compte : tu vas recevoir un lien pour choisir un nouveau mot de passe.</p>
      <label class="champ">E-mail<input id="c-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off"></label>
      <p class="hint" id="c-msg"></p>
      <div class="panel-foot"><button type="button" class="lien" data-vue="connexion">Retour</button><button class="btn" type="submit">Envoyer le lien</button></div>
    </form>`;
  if (vue === 'nouveau-mdp') c.innerHTML = `<h2>Nouveau mot de passe</h2>
    <form class="formulaire" id="f-compte" novalidate>
      <label class="champ">Nouveau mot de passe<input id="c-mdp" type="password" autocomplete="new-password"><small>Au moins 8 caractères.</small></label>
      <label class="champ">Encore une fois<input id="c-mdp2" type="password" autocomplete="new-password"></label>
      <p class="hint" id="c-msg"></p>
      <div class="panel-foot"><button class="btn" type="submit">Enregistrer</button></div>
    </form>`;
  if (!session && VUES_ACCUEIL.includes(vue)) {
    c.insertAdjacentHTML('beforeend', `<div class="choix-hl">
      <button type="button" class="lien" id="btn-hors-ligne">Jouer hors ligne</button>
      <small>Pour s'entraîner sans compte : rien ne sera enregistré.</small></div>`);
    $('btn-hors-ligne').onclick = entrerHorsLigne;
  }
  c.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => ouvrirCompte(b.dataset.vue));
  $('f-compte').onsubmit = e => { e.preventDefault(); ACTIONS_COMPTE[vue](); };
  const premier = c.querySelector('input'); if (premier) premier.focus();

const ACTIONS_COMPTE = {
  async connexion() {
    const identifiant = valeur('c-email'), password = $('c-mdp').value;
    if (!identifiant || !password) return msgCompte('Écris ton e-mail ou ton pseudo, et ton mot de passe.');
    msgCompte('Connexion…', true);
    let email = identifiant.toLowerCase();
    if (!identifiant.includes('@')) {
      // Pseudo : le serveur rend l'e-mail du compte seulement si le mot de passe est le bon
      const { data, error } = await appel(sb.rpc('email_pour_connexion', { p_pseudo: identifiant, p_mdp: password }));
      if (error) return msgCompte(messageErreur(error));
      if (!data) return msgCompte('Pseudo ou mot de passe incorrect.');
      email = data;
    }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) msgCompte(messageErreur(error));
    // Si c'est bon, le changement de session charge le profil et affiche le compte.
  },
  async inscription() {
    const pseudo = valeur('c-pseudo'), email = valeur('c-email').toLowerCase(), password = $('c-mdp').value;
    if (!PSEUDO_OK.test(pseudo)) return msgCompte('Le pseudo doit faire de 3 à 20 caractères : lettres sans accents, chiffres, - ou _.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return msgCompte('Cette adresse e-mail n\'est pas valide.');
    if (password.length < 8) return msgCompte('Le mot de passe doit faire au moins 8 caractères.');
    if (password !== $('c-mdp2').value) return msgCompte('Les deux mots de passe ne sont pas pareils.');
    if (!$('c-parent').checked) return msgCompte('Demande d\'abord à un de tes parents s\'il est d\'accord, puis coche la case.');
    msgCompte('Création du compte…', true);
    const { data: libre, error: e1 } = await sb.rpc('pseudo_disponible', { p: pseudo });
    if (e1) return msgCompte(messageErreur(e1));
    if (!libre) return msgCompte('Ce pseudo est déjà pris : choisis-en un autre.');
    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { pseudo }, emailRedirectTo: lienRetour() } });
    if (error) return msgCompte(messageErreur(error));
    if (!data.session) msgCompte(`Presque fini ! Un e-mail a été envoyé à ${email}. Clique sur le lien qu'il contient pour activer ton compte, puis connecte-toi.`, true);
  },
  async oubli() {
    const email = valeur('c-email').toLowerCase();
    if (!email) return msgCompte('Écris l\'adresse e-mail de ton compte.');
    msgCompte('Envoi…', true);
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: lienRetour() });
    if (error) return msgCompte(messageErreur(error));
    msgCompte('Si un compte existe avec cette adresse, un e-mail vient d\'être envoyé. Ouvre le lien qu\'il contient pour choisir un nouveau mot de passe.', true);
  },
  async 'nouveau-mdp'() {
    const password = $('c-mdp').value;
    if (password.length < 8) return msgCompte('Le mot de passe doit faire au moins 8 caractères.');
    if (password !== $('c-mdp2').value) return msgCompte('Les deux mots de passe ne sont pas pareils.');
    const { error } = await sb.auth.updateUser({ password });
    if (error) return msgCompte(messageErreur(error));
    msgCompte('Mot de passe changé !', true);
    setTimeout(() => ouvrirCompte('profil'), 1200);
  },
};

async function afficherProfil(c) {
  if (!profil) { c.innerHTML = '<h2>Mon compte</h2><p>Chargement…</p>'; return; }
  const pct = profil.reponses ? Math.round(100 * profil.bonnes / profil.reponses) : 0;
  c.innerHTML = `<h2>Salut ${esc(profil.pseudo)} !</h2>
    <div class="chiffres">
      <div><b>${profil.series_jouees}</b><span>séries jouées</span></div>
      <div><b>${pct} %</b><span>de bonnes réponses</span></div>
      <div><b>${profil.record}</b><span>record d'affilée</span></div>
    </div>
    <div><span class="label">Mes dernières séries</span><ul class="historique" id="historique"><li>Chargement…</li></ul></div>
    <p class="stats">Ton code ami : <b class="code">${esc(profil.code_ami)}</b>. Donne-le à tes copains pour suivre vos progrès : <button type="button" class="lien" data-vue="amis">voir mes amis</button>.</p>
    <div class="panel-foot">
      <button class="btn ghost" type="button" id="btn-deconnexion">Me déconnecter</button>
      <button class="btn" type="button" id="btn-jouer">Jouer</button>
    </div>`;
  $('btn-deconnexion').onclick = async () => { vueCompte = null; await sb.auth.signOut(); };
  $('btn-jouer').onclick = () => { $('compte').hidden = true; $('answer').focus(); };
  c.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => ouvrirCompte(b.dataset.vue));
  const { data } = await sb.from('series').select('temps, score, longueur, exceptions, joue_le').order('joue_le', { ascending: false }).limit(5);
  const h = $('historique'); if (!h) return;
  h.innerHTML = data && data.length
    ? data.map(s => `<li><span>${new Date(s.joue_le).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</span>
        <span>${s.temps.map(t => TEMPS[t] ? TEMPS[t].nom : esc(t)).join(', ')}${s.exceptions ? ' · exceptions' : ''}</span><b>${s.score} / ${s.longueur}</b></li>`).join('')
    : '<li>Pas encore de série terminée. À toi de jouer !</li>';
}

// ---------- Amis (code ami) ----------
let amis = null; // null : la fonction n'existe pas encore côté serveur
const CODE_OK = /^[A-HJ-NP-Z2-9]{6}$/;

function ilYa(date) {
  if (!date) return 'n\'a pas encore joué';
  const jours = Math.floor((Date.now() - new Date(date)) / 86400000);
  if (jours <= 0) return 'a joué aujourd\'hui';
  if (jours === 1) return 'a joué hier';
  return `a joué il y a ${jours} jours`;
}

async function rafraichirAmis() {
  if (!sb || !session) { amis = null; majBoutonAmis(); return; }
  const { data, error } = await appel(sb.rpc('mes_amis'));
  amis = error ? null : data;
  await rafraichirDefis();
  majBoutonAmis();
}
function majBoutonAmis() {
  const b = $('btn-amis');
  b.hidden = !profil || amis === null;
  const demandes = (amis || []).filter(a => a.etat === 'recue').length, aRelever = aJouer(), n = demandes + aRelever;
  $('nb-demandes').hidden = !n;
  $('nb-demandes').textContent = n;
  const morceaux = [];
  if (demandes) morceaux.push(`${demandes} demande${demandes > 1 ? 's' : ''} d'ami`);
  if (aRelever) morceaux.push(`${aRelever} défi${aRelever > 1 ? 's' : ''} à relever`);
  b.setAttribute('aria-label', morceaux.length ? `Amis : ${morceaux.join(', ')}` : 'Amis');
}

async function afficherAmis(c) {
  c.innerHTML = `<h2>Mes amis</h2>${ongletsAmis('amis')}
    <div class="mon-code">
      <div><span class="label">Ton code ami</span><b class="code grand" id="mon-code">${esc(profil ? profil.code_ami : '……')}</b></div>
      <button class="btn ghost" type="button" id="btn-copier-code">Copier</button>
    </div>
    <p class="stats">Donne ce code à un copain, en vrai ou par un message de tes parents. Avec ton code, il peut t'envoyer une demande.</p>
    <form class="ajout-ami" id="f-ami" novalidate>
      <label class="champ">Ajouter un ami avec son code<input id="c-code" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Ex. : K7P3QX"></label>
      <button class="btn" type="submit">Envoyer la demande</button>
    </form>
    <p class="hint" id="c-msg"></p>
    <div id="liste-amis" class="liste-amis"><p>Chargement…</p></div>`;
  c.querySelectorAll('.onglets [data-vue]').forEach(b => b.onclick = () => ouvrirCompte(b.dataset.vue));
  $('btn-copier-code').onclick = () => {
    const code = profil ? profil.code_ami : '';
    navigator.clipboard.writeText(code).then(() => msgCompte('Code copié !', true)).catch(() => {
      const r = document.createRange(); r.selectNodeContents($('mon-code'));
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      msgCompte('Code sélectionné : tu peux le copier.', true);
    });
  };
  $('c-code').oninput = e => { e.target.value = e.target.value.toUpperCase().replace(/\s/g, ''); };
  $('f-ami').onsubmit = async e => {
    e.preventDefault();
    const code = valeur('c-code').toUpperCase();
    if (/[0O1I]/.test(code)) return msgCompte('Un code ami ne contient jamais de O, de 0, de I ni de 1 : vérifie le code.');
    if (!CODE_OK.test(code)) return msgCompte('Un code ami fait 6 caractères (lettres et chiffres).');
    msgCompte('Envoi…', true);
    const { data, error } = await appel(sb.rpc('demander_ami', { p_code: code }));
    if (error) return msgCompte(messageErreur(error));
    const [etat, pseudo] = String(data).split(':');
    const nom = esc(pseudo || '');
    const textes = {
      envoyee: [`Demande envoyée à ${nom} ! Vous serez amis quand ${nom} l'aura acceptée.`, true],
      acceptee: [`${nom} t'avait déjà envoyé une demande : vous êtes maintenant amis !`, true],
      deja_amis: [`Tu es déjà ami avec ${nom}.`, true],
      deja_demandee: [`Tu as déjà envoyé une demande à ${nom} : il faut attendre sa réponse.`, true],
      soi_meme: ['C\'est ton propre code ! Demande celui de ton copain.', false],
      introuvable: ['Aucun compte n\'a ce code. Vérifie les 6 caractères avec ton copain.', false],
      trop_essais: ['Trop de codes faux d\'affilée : réessaie dans une heure.', false],
    };
    const [texte, ok] = textes[etat] || ['Ça n\'a pas marché, réessaie.', false];
    msgCompte(texte, ok);
    if (ok) $('c-code').value = '';
    await rafraichirAmis(); rendreAmis();
  };
  await rafraichirAmis();
  rendreAmis();
}

function carteChiffres(x) {
  const pct = x.reponses ? Math.round(100 * x.bonnes / x.reponses) : 0;
  return `<div class="ami-chiffres">
      <span><b>${x.series_jouees}</b> séries</span><span><b>${pct} %</b> réussite</span>
      <span><b>${x.record}</b> record</span>${x.series_7j == null ? '' : `<span><b>${x.series_7j}</b> cette semaine</span>`}</div>`;
}

function rendreAmis() {
  const zone = $('liste-amis'); if (!zone) return;
  if (amis === null) { zone.innerHTML = '<p class="stats">Les amis ne sont pas encore activés sur le serveur.</p>'; return; }
  const recues = amis.filter(a => a.etat === 'recue'), envoyees = amis.filter(a => a.etat === 'envoyee'), copains = amis.filter(a => a.etat === 'ami');
  let html = '';
  if (recues.length) html += `<div><span class="label">Demandes reçues</span><ul class="demandes">${recues.map(a => `
      <li><b>${esc(a.pseudo)}</b> veut être ton ami.
        <span class="boutons"><button class="btn ok" type="button" data-accepter="${a.lien}">Accepter</button>
        <button class="btn ghost" type="button" data-refuser="${a.lien}">Refuser</button></span></li>`).join('')}</ul></div>`;
  html += `<div><span class="label">Mes amis</span><ul class="amis">`;
  if (profil) html += `<li class="ami moi"><div class="ami-tete"><b>Toi</b><span>${esc(profil.pseudo)}</span></div>${carteChiffres({ ...profil, series_7j: null })}</li>`;
  html += copains.length ? copains.map((a, i) => `
      <li class="ami p${(i + 1) % 6}"><div class="ami-tete"><b>${esc(a.pseudo)}</b><span>${ilYa(a.derniere_serie)}</span></div>
        ${carteChiffres(a)}
        <div class="ami-actions"><button class="lien" type="button" data-voir="${a.ami}">Voir ses séries</button>
          <button class="lien danger" type="button" data-retirer="${a.lien}">Retirer</button></div>
        <ul class="historique" id="hist-${a.ami}" hidden></ul></li>`).join('')
    : '<li class="vide">Pas encore d\'ami. Envoie une demande avec le code d\'un copain !</li>';
  html += '</ul></div>';
  if (envoyees.length) html += `<div><span class="label">Demandes envoyées</span><ul class="demandes">${envoyees.map(a => `
      <li><b>${esc(a.pseudo)}</b> n'a pas encore répondu.
        <span class="boutons"><button class="lien" type="button" data-retirer="${a.lien}">Annuler</button></span></li>`).join('')}</ul></div>`;
  zone.innerHTML = html;

  const agir = async (requete) => { const { error } = await appel(requete); if (error) msgCompte(messageErreur(error)); await rafraichirAmis(); rendreAmis(); };
  zone.querySelectorAll('[data-accepter]').forEach(b => b.onclick = () => agir(sb.rpc('repondre_ami', { p_lien: +b.dataset.accepter, p_accepter: true })));
  zone.querySelectorAll('[data-refuser]').forEach(b => b.onclick = () => agir(sb.rpc('repondre_ami', { p_lien: +b.dataset.refuser, p_accepter: false })));
  zone.querySelectorAll('[data-retirer]').forEach(b => b.onclick = () => {
    // Deux appuis : le premier demande confirmation
    if (!b.dataset.confirme) { b.dataset.confirme = '1'; b.textContent = 'Sûr ? Appuie encore'; return; }
    agir(sb.rpc('retirer_ami', { p_lien: +b.dataset.retirer }));
  });
  zone.querySelectorAll('[data-voir]').forEach(b => b.onclick = async () => {
    const h = $('hist-' + b.dataset.voir);
    if (!h.hidden) { h.hidden = true; b.textContent = 'Voir ses séries'; return; }
    h.hidden = false; b.textContent = 'Cacher ses séries'; h.innerHTML = '<li>Chargement…</li>';
    const { data, error } = await appel(sb.rpc('series_ami', { p_ami: b.dataset.voir }));
    h.innerHTML = error ? `<li>${messageErreur(error)}</li>` : data.length
      ? data.map(s => `<li><span>${new Date(s.joue_le).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</span>
          <span>${s.temps.map(t => TEMPS[t] ? TEMPS[t].nom : esc(t)).join(', ')}${s.exceptions ? ' · exceptions' : ''}</span><b>${s.score} / ${s.longueur}</b></li>`).join('')
      : '<li>Pas encore de série terminée.</li>';
  });
}

// ---------- Défis entre amis ----------
let defis = null; // null : pas encore activés côté serveur

const ongletsAmis = vue => `<div class="onglets">
    <button type="button" class="${vue === 'amis' ? 'actif' : ''}" data-vue="amis">Mes amis</button>
    <button type="button" class="${vue === 'defis' ? 'actif' : ''}" data-vue="defis">Défis${aJouer() ? ` <span class="pastille">${aJouer()}</span>` : ''}</button>
  </div>`;
const enCours = d => new Date(d.expire_le) > new Date();
const aJouer = () => (defis || []).filter(d => d.mon_score === null && enCours(d)).length;
function duree(sec) {
  if (sec == null) return '';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? `${m} min ${String(s).padStart(2, '0')} s` : `${s} s`;
}
function resteJours(d) {
  const j = Math.ceil((new Date(d.expire_le) - Date.now()) / 86400000);
  return j <= 0 ? 'terminé' : j === 1 ? 'dernier jour' : `encore ${j} jours`;
}

async function rafraichirDefis() {
  if (!sb || !session) { defis = null; return; }
  const { data, error } = await appel(sb.rpc('mes_defis'));
  defis = error ? null : data;
}

async function afficherDefis(c) {
  const copains = (amis || []).filter(a => a.etat === 'ami');
  const resumeReglages = `${reglages.longueur} questions · ${reglages.temps.map(t => TEMPS[t].nom).join(', ')} · ${reglages.exceptions ? 'verbes à exceptions' : 'tous les verbes'}`;
  c.innerHTML = `<h2>Défis</h2>${ongletsAmis('defis')}
    <section class="nouveau-defi">
      <span class="label">Lancer un défi</span>
      ${copains.length ? `
        <p>Choisis qui tu défies. Vous aurez exactement les mêmes questions : le meilleur score gagne, et en cas d'égalité, le plus rapide.</p>
        <div class="options" id="choix-amis">${copains.map(a => `<label class="opt"><input type="checkbox" value="${a.ami}"> ${esc(a.pseudo)}</label>`).join('')}</div>
        <p class="stats">Série : ${resumeReglages}. <button type="button" class="lien" id="btn-defi-reglages">Changer dans les réglages</button></p>
        <div class="panel-foot"><button class="btn" type="button" id="btn-creer-defi">Créer le défi et jouer</button></div>`
      : '<p class="stats">Ajoute d\'abord un ami dans l\'onglet « Mes amis » pour pouvoir le défier.</p>'}
    </section>
    <p class="hint" id="c-msg"></p>
    <div id="liste-defis" class="liste-amis"><p>Chargement…</p></div>`;
  c.querySelectorAll('[data-vue]').forEach(b => b.onclick = () => ouvrirCompte(b.dataset.vue));
  if ($('btn-defi-reglages')) $('btn-defi-reglages').onclick = () => { $('compte').hidden = true; $('btn-reglages').click(); };
  if ($('btn-creer-defi')) $('btn-creer-defi').onclick = creerDefi;
  await rafraichirDefis();
  majBoutonAmis();
  rendreDefis();
}

function rendreDefis() {
  const zone = $('liste-defis'); if (!zone) return;
  if (defis === null) { zone.innerHTML = '<p class="stats">Les défis ne sont pas encore activés sur le serveur.</p>'; return; }
  const aRelever = defis.filter(d => d.mon_score === null && enCours(d));
  const autres = defis.filter(d => !aRelever.includes(d));
  const carte = d => {
    const joueurs = d.joueurs || [], tousOntJoue = joueurs.every(j => j.a_joue), jai = d.mon_score !== null;
    const meilleur = jai && joueurs[0] && joueurs[0].a_joue ? joueurs[0] : null;
    const classement = joueurs.map((j, i) => {
      let res = !j.a_joue ? (enCours(d) ? 'pas encore joué' : 'n\'a pas joué') : jai ? `<b>${j.score} / ${d.questions.length}</b> · ${duree(j.duree)}` : 'a joué';
      const rang = jai && j.a_joue ? `<span class="rang">${i + 1}<sup>${i ? 'e' : 'er'}</sup></span>` : '';
      return `<li class="${j.moi ? 'moi' : ''}">${rang}<span class="nom">${j.moi ? 'Toi' : esc(j.pseudo)}</span><span>${res}</span></li>`;
    }).join('');
    const titre = d.est_createur ? 'Ton défi' : `Défi de ${esc(d.createur)}`;
    const fin = (tousOntJoue || !enCours(d)) && meilleur ? `<p class="gagnant">${meilleur.moi ? 'Tu as gagné ce défi !' : `${esc(meilleur.pseudo)} a gagné ce défi.`}</p>` : '';
    return `<li class="defi">
      <div class="ami-tete"><b>${titre}</b><span>${resteJours(d)}</span></div>
      <p class="stats">${d.questions.length} questions · ${d.temps.map(t => TEMPS[t] ? TEMPS[t].nom : esc(t)).join(', ')}</p>
      ${!jai && enCours(d) ? `<p class="stats">Les scores des autres s'affichent quand tu as joué.</p>` : ''}
      <ul class="classement">${classement}</ul>${fin}
      ${!jai && enCours(d) ? `<div class="panel-foot"><button class="btn ok" type="button" data-jouer="${d.defi}">Relever le défi</button></div>` : ''}
    </li>`;
  };
  zone.innerHTML = (aRelever.length ? `<div><span class="label">À relever</span><ul class="amis">${aRelever.map(carte).join('')}</ul></div>` : '')
    + `<div><span class="label">Mes défis</span><ul class="amis">${autres.length ? autres.map(carte).join('') : '<li class="ami vide">Pas encore de défi terminé.</li>'}</ul></div>`;
  zone.querySelectorAll('[data-jouer]').forEach(b => b.onclick = () => jouerDefi(defis.find(d => String(d.defi) === b.dataset.jouer)));
}

async function creerDefi() {
  const choisis = [...document.querySelectorAll('#choix-amis input:checked')].map(i => i.value);
  if (!choisis.length) return msgCompte('Coche au moins un ami à défier.');
  // On tire la série maintenant : tout le monde aura exactement les mêmes questions
  const questions = [];
  for (let i = 0; i < reglages.longueur; i++) {
    const it = tirerItem();
    questions.push({ v: it.verbe.inf, p: it.p, t: it.temps, s: it.sujet, g: it.genre, n: it.nom });
  }
  const temps = [...new Set(questions.map(q => q.t))];
  msgCompte('Création du défi…', true);
  const { data: id, error } = await appel(sb.rpc('creer_defi', { p_questions: questions, p_temps: temps, p_amis: choisis }));
  if (error) return msgCompte(messageErreur(error));
  await rafraichirDefis();
  const d = (defis || []).find(x => x.defi === id);
  if (d) jouerDefi(d); else msgCompte('Défi créé ! Retrouve-le dans la liste.', true);
}

function jouerDefi(d) {
  if (!d) return;
  const items = d.questions.map(q => {
    const verbe = VERBES.find(v => v.inf === q.v);
    return verbe && TEMPS[q.t] ? { verbe, p: q.p, temps: q.t, sujet: q.s, genre: q.g || '?', nom: !!q.n } : null;
  }).filter(Boolean);
  if (!items.length) return msgCompte('Ce défi ne peut pas être joué sur cette version de l\'appli.');
  $('compte').hidden = true;
  const adversaires = (d.joueurs || []).filter(j => !j.moi).map(j => j.pseudo);
  nouvelleSerie(items, { id: d.defi, adversaires, longueur: d.questions.length });
}

async function terminerDefi() {
  const zone = $('fin-defi'); if (!zone) return;
  const sec = Math.round((Date.now() - serie.debut) / 1000);
  // Si des questions n'existent plus dans cette version, on les compte comme ratées
  const { error } = await appel(sb.rpc('enregistrer_defi', { p_defi: serie.defi.id, p_score: serie.score, p_duree: sec }));
  zone.innerHTML = error ? messageErreur(error)
    : `Défi terminé en ${duree(sec)} ! <button type="button" class="lien" id="btn-voir-defi">Voir le classement</button>`;
  if ($('btn-voir-defi')) $('btn-voir-defi').onclick = () => ouvrirCompte('defis');
  await rafraichirDefis(); majBoutonAmis();
}

// Enregistrement des séries ; sans réseau, elles attendent dans le téléphone
async function appel(requete) { try { return await requete; } catch (e) { return { error: e }; } }
function lireAttente() { try { return JSON.parse(localStorage.getItem(ATTENTE) || '[]'); } catch (e) { return []; } }
function ecrireAttente(l) { try { localStorage.setItem(ATTENTE, JSON.stringify(l)); } catch (e) {} }
async function enregistrerSerieEnLigne(donnees) {
  if (modeHorsLigne) return 'hors-ligne';
  if (!sb || !session) return 'local';
  const { error } = await appel(sb.rpc('enregistrer_serie', donnees));
  if (error) { ecrireAttente([...lireAttente(), { uid: session.user.id, donnees }]); return 'attente'; }
  const { data } = await sb.from('profils').select('*').eq('id', session.user.id).maybeSingle();
  if (data) profil = data;
  return 'ok';
}
async function envoyerEnAttente() {
  if (!session) return;
  const reste = [];
  for (const a of lireAttente()) {
    if (a.uid !== session.user.id) { reste.push(a); continue; }
    const { error } = await appel(sb.rpc('enregistrer_serie', a.donnees));
    if (error) reste.push(a);
  }
  ecrireAttente(reste);
}

function entrerHorsLigne() {
  modeHorsLigne = true;
  document.body.classList.add('hors-ligne');
  afficherPorte(true);
  nouvelleSerie();
}
function quitterHorsLigne(versConnexion = true) {
  modeHorsLigne = false;
  document.body.classList.remove('hors-ligne');
  stats = lireStats(); // oublie tout ce qui a été joué hors ligne
  if (versConnexion) { vueCompte = null; afficherPorte(false); }
}

function initCompte() {
  $('btn-quitter-hl').onclick = () => quitterHorsLigne();
  $('btn-amis').onclick = () => {
    if (!$('compte').hidden && ['amis', 'defis'].includes(vueCompte)) { $('compte').hidden = true; return; }
    ouvrirCompte(aJouer() ? 'defis' : 'amis');
  };
  // Quand on revient sur l'appli, on regarde s'il y a de nouvelles demandes
  document.addEventListener('visibilitychange', () => { if (!document.hidden && session) rafraichirAmis(); });
  majBoutonCompte();
  if (!sb) return;
  // En attendant de savoir si un compte est déjà connecté, on ne montre pas le jeu
  document.body.classList.add('porte-fermee');
  $('jeu').hidden = true;
  $('btn-compte').onclick = () => {
    if (!$('compte').hidden && !['amis', 'defis'].includes(vueCompte)) { $('compte').hidden = true; return; }
    ouvrirCompte(profil ? 'profil' : 'connexion');
  };
  sb.auth.onAuthStateChange((evenement, s) => {
    session = s;
    if (evenement === 'PASSWORD_RECOVERY') ouvrirCompte('nouveau-mdp');
    if (s && modeHorsLigne) quitterHorsLigne(false);
    afficherPorte(!!s || modeHorsLigne);
    // On sort du rappel avant de reparler au serveur (recommandation Supabase)
    setTimeout(chargerProfil, 0);
  });
}

// ---------- Clavier d'accents ----------
['é', 'è', 'ê', 'à', 'â', 'ç', 'î', 'ï', 'ô', 'û', 'ù'].forEach(c => {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = c; b.setAttribute('aria-label', 'Ajouter ' + c);
  b.onmousedown = e => e.preventDefault();
  b.onclick = () => {
    const inp = $('answer'); if (inp.disabled) return;
    const s = inp.selectionStart ?? inp.value.length, e2 = inp.selectionEnd ?? inp.value.length;
    inp.value = inp.value.slice(0, s) + c + inp.value.slice(e2);
    inp.focus(); inp.setSelectionRange(s + 1, s + 1);
  };
  $('accents').appendChild(b);
});

initCompte();
nouvelleSerie();
</script>
